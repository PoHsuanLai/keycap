[workspace]
resolver = "3"
members = ["crates/keycap", "crates/keycap-core", "crates/keycap-protocol", "crates/keycap-client", "crates/keycap-sys", "crates/keycap-devtest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/keycap"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
toml = "1"
notify = "8.2"
# Poll, SOCK_SEQPACKET, eventfd, CLOCK_MONOTONIC and file opens without libc's unsafe surface.
rustix = { version = "1", features = ["event", "fs", "net", "time", "process"] }
# The evdev and uinput ioctls behind safe handles, so no crate here needs `unsafe`.
input-linux = { version = "0.7", default-features = false }
# The portable keymap core: actions, chords, overrides, the resolver. keycap is only this
# desktop's source and remapper; it defines no keymap nouns of its own.
chordkit = { git = "https://github.com/PoHsuanLai/chordkit.git", rev = "99eec9ddd03ee345b669fcc7954ed44590724290" }

# The bounded reader for a settings file, at the same chordkit revision as `chordkit`;
# Whopper moves it with the chordkit pin above.
chordkit-file = { git = "https://github.com/PoHsuanLai/chordkit.git", rev = "99eec9ddd03ee345b669fcc7954ed44590724290" }

# The typed verbs casement sends sill, so keycap-client's handled-actions table names them; the
# casement-protocols revision is moved by Whopper.
shell-verbs = { git = "https://github.com/PoHsuanLai/casement-protocols", rev = "fa664f1fcb312abd7e7a0e38ccae216406e88139" }

# Caller identity (who is on the other end of the socket) and the root service that makes the
# virtual devices, by git tag, never by path.
peephole = { git = "https://github.com/PoHsuanLai/peephole", tag = "v0.1.7" }
peephole-core = { git = "https://github.com/PoHsuanLai/peephole", tag = "v0.1.7", features = ["desktop"] }
turnstile-client = { git = "https://github.com/PoHsuanLai/turnstile", tag = "v0.1.6" }

# The socket guards (who is the shell, who has the seat), shared with palmrest, by git rev.
latchkey = { git = "https://github.com/PoHsuanLai/latchkey", rev = "b10ae1b8c49c55cce2c5affde8f5db76edb66ab4", features = ["guard"] }

# A panic must kill the process, so the kernel releases the keyboard grab and systemd restarts
# it. Only release: tests need unwinding.
[profile.release]
panic = "abort"
