[package]
name = "keycap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Mac keyboard mapping daemon: grabs keyboards, remaps by profile, writes one virtual keyboard; the desktop picks the profile over a socket"

[lints]
workspace = true

[dependencies]
keycap-core = { path = "../keycap-core" }
keycap-protocol = { path = "../keycap-protocol" }
keycap-client = { path = "../keycap-client" }
chordkit.workspace = true
thiserror.workspace = true
notify.workspace = true
rustix.workspace = true
input-linux.workspace = true
peephole.workspace = true
latchkey.workspace = true
peephole-core.workspace = true
# The broker that makes the virtual devices, and the device vocabulary its requests are written in.
turnstile-client.workspace = true

[dev-dependencies]
turnstile-client = { workspace = true, features = ["fake"] }
keycap-devtest = { path = "../keycap-devtest" }
# A held process that is only a claim, for tests of who the socket's peer is; never in a shipped build.
peephole = { workspace = true, features = ["fake"] }
