# keycap: machine settings for a Plasma 6 session. Install to /etc/keycap/keycap.toml
# (install.sh does it on Plasma when the file is absent). It lays over the built-in mapping, so
# only the differences are listed. Personal preferences do not belong here: put them in your own
# config (see docs/personal-config.md).
#
# Each line is the macOS shortcut written as the Plasma shortcut that does the same job:
# - Cmd+Space is Spotlight; Plasma's launcher is KRunner on Alt+Space. (The built-in Super+Space
#   is sill's launcher on COSMIC.)
# - Cmd+Ctrl+Space is the emoji picker (Plasma: Meta+.), Cmd+Ctrl+F is full screen, Cmd+H hides
#   (Plasma: minimise), Cmd+F3 shows the desktop, Cmd+Shift+3/4/5 are the screenshot shortcuts
#   (Spectacle: Shift+Print, Alt+Print, Print), Ctrl+Left/Right change desktop (Spaces).

[profile.default]
rules = [
  { when = "command+space", then = "alt+space" },
  { when = "command+control+space", then = "super+dot" },
  { when = "command+control+f", then = "super+shift+f" },
  { when = "command+h", then = "super+pagedown" },
  { when = "command+f3", then = "super+d" },
  { when = "command+shift+3", then = "shift+print" },
  { when = "command+shift+4", then = "alt+print" },
  { when = "command+shift+5", then = "print" },
  { when = "control+left", then = "ctrl+super+left" },
  { when = "control+right", then = "ctrl+super+right" },
]

# A terminal keeps Ctrl+Left and Ctrl+Right for the shell.
[profile.terminal]
rules = [
  { when = "control+left", then = "ctrl+left" },
  { when = "control+right", then = "ctrl+right" },
]
