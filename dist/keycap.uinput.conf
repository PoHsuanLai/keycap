# keycap: the standalone install opens /dev/uinput itself (no turnstile service). Install to
# /etc/systemd/system/keycap.service.d/10-uinput.conf (install.sh does it). The desktop does not
# ship this file: there the root service owns the node and keycap is handed each device.
[Service]
DeviceAllow=/dev/uinput rw
