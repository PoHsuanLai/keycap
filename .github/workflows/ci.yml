name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # The gate from ARCHITECTURE.md: format, lints, the unit and scenario tests, the licence
  # check. No device is touched.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses

  # The real kernel path: the built daemon against a fake keyboard on /dev/uinput. Built as
  # the runner user, run as root because /dev/input nodes are root:input.
  devices:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Load uinput
        run: |
          sudo modprobe uinput
          ls -l /dev/uinput
      - name: Build the device tests, the daemon and the examples
        run: |
          cargo build -p keycap --bins --examples
          cargo test -p keycap --test devices --no-run --message-format=json > "$RUNNER_TEMP/build.json"
          exe="$(jq -r 'select(.profile.test == true and .target.name == "devices") | .executable' "$RUNNER_TEMP/build.json" | tail -n 1)"
          test -x "$exe"
          echo "DEVICE_TESTS=$exe" >> "$GITHUB_ENV"
      - name: Run the device tests as root
        run: |
          mkdir -p "$GITHUB_WORKSPACE/device-test-artifacts"
          sudo -E env "PATH=$PATH" \
            KEYCAP_DEVICE_TESTS=1 \
            KEYCAP_TEST_ARTIFACTS="$GITHUB_WORKSPACE/device-test-artifacts" \
            "$DEVICE_TESTS" --ignored --test-threads=1
      - name: Kernel messages
        if: failure()
        run: sudo dmesg | tail -n 100 || true
      - name: Keep the traces and the daemon's stderr
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-artifacts
          path: device-test-artifacts
          if-no-files-found: ignore

  # The unit under systemd: hardening, watchdog, start limit, recovery.
  systemd:
    needs: devices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Build the release binary and the helpers
        run: cargo build --release -p keycap --bins --examples
      - name: Run the systemd tier
        run: ci/systemd-test.sh
